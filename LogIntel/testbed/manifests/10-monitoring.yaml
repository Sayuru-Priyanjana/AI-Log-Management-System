---
# ==========================================================================
# kube-state-metrics
# ==========================================================================
apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics, namespace: logintel-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: kube-state-metrics }
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints, namespaces, resourcequotas, limitranges,
                replicationcontrollers, persistentvolumeclaims]
    verbs: [list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-state-metrics }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: logintel-system }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: logintel-system
  labels: { app: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app: kube-state-metrics } }
  template:
    metadata:
      labels: { app: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.1
          args:
            - --resources=pods,deployments,replicasets,nodes,services,namespaces
          ports:
            - { containerPort: 8080, name: http-metrics }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits:   { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: logintel-system
  labels: { app: kube-state-metrics }
spec:
  selector: { app: kube-state-metrics }
  ports:
    - { name: http-metrics, port: 8080, targetPort: http-metrics }
---
# ==========================================================================
# Prometheus
# ==========================================================================
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: logintel-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus }
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: logintel-system }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: logintel-system }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: logintel-testbed

    scrape_configs:
      # --- cAdvisor: container CPU / memory / throttling -------------------
      # namespace, pod and container labels come from cAdvisor itself and are
      # left untouched, so they mean what they say.
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        metric_relabel_configs:
          # cAdvisor is by far the largest series source; keep only what the
          # signal engine actually reads.
          - source_labels: [__name__]
            regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|cpu_cfs_throttled_seconds_total|cpu_cfs_periods_total|spec_memory_limit_bytes|spec_cpu_quota|spec_cpu_period|last_seen)'
            action: keep
          - source_labels: [container]
            regex: '^$'
            action: drop

      # --- kubelet: pod-level state ---------------------------------------
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # --- kube-state-metrics ----------------------------------------------
      # honor_labels is essential: without it Prometheus renames KSM's own
      # namespace/pod/container labels to exported_* and every namespace filter
      # against these metrics silently matches nothing.
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ['kube-state-metrics.logintel-system.svc:8080']

      # --- application pods --------------------------------------------------
      - job_name: shopdemo-pods
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          # System identity travels with the metric so it can be scoped the same
          # way logs and events are.
          - source_labels: [__meta_kubernetes_pod_label_logintel_system_id]
            target_label: system_id
          - source_labels: [__meta_kubernetes_pod_label_logintel_environment]
            target_label: environment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: logintel-system
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext: { fsGroup: 65534, runAsUser: 65534, runAsNonRoot: true }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # 12h is plenty for baseline comparison and keeps the TSDB tiny on a
            # 3 GB box.
            - --storage.tsdb.retention.time=12h
            - --web.enable-lifecycle
          ports: [{ containerPort: 9090, name: web }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 640Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data,   mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data,   emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: logintel-system
  labels: { app: prometheus }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - { name: web, port: 9090, targetPort: web, nodePort: 30090 }
