# The UI is served as static files, with the agent proxied behind the same
# origin. Two consequences, both deliberate:
#
#   - There is no CORS to configure and no agent URL to bake into the bundle.
#     The browser asks its own origin for /api/... and nginx forwards it.
#   - The agent never has to be exposed to the browser's network at all. In
#     compose it is reachable as `agent:8000` on the internal network; the
#     published port exists for curl and the eval harness, not for this page.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: /incidents is a route, not a file. Without this a
    # reload or a typed URL returns 404 from nginx before React ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they can be cached indefinitely. index.html
    # must not be, or a deploy leaves browsers pinned to the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An investigation is streamed as NDJSON, one line per stage, and the
        # whole point is watching it arrive. Buffering holds the response until
        # the run finishes, which turns a live trace into a blank page followed
        # by everything at once.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # A cold local model can take minutes on the first call.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
