---
# ==========================================================================
# shopdemo — a three-tier system with a real dependency chain:
#
#     loadgen -> checkout-api -> payment-api -> payment-db
#
# The chain is the point. A fault at the bottom surfaces as errors at the top,
# so an investigation that names the reported symptom instead of the root cause
# is measurably wrong.
# ==========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-db
  namespace: shopdemo
  labels: { app: payment-db }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-db } }
  template:
    metadata:
      labels:
        app: payment-db
        logintel/log: "true"
        logintel/system-id: shopdemo
        logintel/system-name: Shop_Demo
        logintel/environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python3", "-u", "/src/service.py"]
          env:
            - { name: SERVICE_NAME,    value: "payment-db" }
            - { name: SERVICE_VERSION, value: "1.0.0" }
            - { name: SERVICE_TIER,    value: "datastore" }
            - { name: ROUTE,           value: "/api/query" }
            - { name: PORT,            value: "8080" }
            - { name: BASE_LATENCY_MS, value: "6" }
            - { name: BASE_ERROR_RATE, value: "0.002" }
            - { name: CRASH_ON_START,  value: "false" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          ports: [{ containerPort: 8080, name: http }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            # 3s rather than the 1s default: under the CPU-saturation scenario a
            # 1s probe times out, and the pod going NotReady would confuse a
            # resource incident with a readiness one.
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts: [{ name: src, mountPath: /src }]
      volumes:
        - { name: src, configMap: { name: service-src } }
---
apiVersion: v1
kind: Service
metadata: { name: payment-db, namespace: shopdemo, labels: { app: payment-db } }
spec:
  selector: { app: payment-db }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: shopdemo
  labels: { app: payment-api }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-api } }
  template:
    metadata:
      labels:
        app: payment-api
        logintel/log: "true"
        logintel/system-id: shopdemo
        logintel/system-name: Shop_Demo
        logintel/environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python3", "-u", "/src/service.py"]
          env:
            - { name: SERVICE_NAME,         value: "payment-api" }
            - { name: SERVICE_VERSION,      value: "1.0.0" }
            - { name: SERVICE_TIER,         value: "backend" }
            - { name: ROUTE,                value: "/api/payment" }
            - { name: PORT,                 value: "8080" }
            - { name: DEPENDENCY_NAME,      value: "payment-db" }
            - { name: DEPENDENCY_URL,       value: "http://payment-db.shopdemo.svc:8080/api/query" }
            - { name: DEPENDENCY_TIMEOUT_S, value: "2.0" }
            - { name: BASE_LATENCY_MS,      value: "10" }
            - { name: BASE_ERROR_RATE,      value: "0.005" }
            - { name: CRASH_ON_START,       value: "false" }
            - { name: PYTHONUNBUFFERED,     value: "1" }
          ports: [{ containerPort: 8080, name: http }]
          resources:
            # The limits are deliberately tight: 256Mi is what the memory-leak
            # scenario breaches, 300m is what the CPU scenario saturates.
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            # 3s rather than the 1s default: under the CPU-saturation scenario a
            # 1s probe times out, and the pod going NotReady would confuse a
            # resource incident with a readiness one.
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts: [{ name: src, mountPath: /src }]
      volumes:
        - { name: src, configMap: { name: service-src } }
---
apiVersion: v1
kind: Service
metadata: { name: payment-api, namespace: shopdemo, labels: { app: payment-api } }
spec:
  selector: { app: payment-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: shopdemo
  labels: { app: checkout-api }
spec:
  replicas: 1
  selector: { matchLabels: { app: checkout-api } }
  template:
    metadata:
      labels:
        app: checkout-api
        logintel/log: "true"
        logintel/system-id: shopdemo
        logintel/system-name: Shop_Demo
        logintel/environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python3", "-u", "/src/service.py"]
          env:
            - { name: SERVICE_NAME,         value: "checkout-api" }
            - { name: SERVICE_VERSION,      value: "1.0.0" }
            - { name: SERVICE_TIER,         value: "frontend" }
            - { name: ROUTE,                value: "/api/checkout" }
            - { name: PORT,                 value: "8080" }
            - { name: DEPENDENCY_NAME,      value: "payment-api" }
            - { name: DEPENDENCY_URL,       value: "http://payment-api.shopdemo.svc:8080/api/payment" }
            - { name: DEPENDENCY_TIMEOUT_S, value: "3.0" }
            - { name: BASE_LATENCY_MS,      value: "8" }
            - { name: BASE_ERROR_RATE,      value: "0.005" }
            - { name: CRASH_ON_START,       value: "false" }
            - { name: PYTHONUNBUFFERED,     value: "1" }
          ports: [{ containerPort: 8080, name: http }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            # 3s rather than the 1s default: under the CPU-saturation scenario a
            # 1s probe times out, and the pod going NotReady would confuse a
            # resource incident with a readiness one.
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts: [{ name: src, mountPath: /src }]
      volumes:
        - { name: src, configMap: { name: service-src } }
---
apiVersion: v1
kind: Service
metadata: { name: checkout-api, namespace: shopdemo, labels: { app: checkout-api } }
spec:
  selector: { app: checkout-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: shopdemo
  labels: { app: loadgen }
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata:
      labels:
        app: loadgen
        logintel/log: "true"
        logintel/system-id: shopdemo
        logintel/system-name: Shop_Demo
        logintel/environment: staging
    spec:
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python3", "-u", "/src/loadgen.py"]
          env:
            - { name: SERVICE_NAME,     value: "loadgen" }
            - { name: TARGET_URL,       value: "http://checkout-api.shopdemo.svc:8080/api/checkout" }
            - { name: RPS,              value: "2" }
            - { name: CONCURRENCY,      value: "2" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          ports: [{ containerPort: 8080, name: http }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 96Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts: [{ name: src, mountPath: /src }]
      volumes:
        - { name: src, configMap: { name: service-src } }
---
apiVersion: v1
kind: Service
metadata: { name: loadgen, namespace: shopdemo, labels: { app: loadgen } }
spec:
  selector: { app: loadgen }
  ports: [{ name: http, port: 8080, targetPort: http }]
