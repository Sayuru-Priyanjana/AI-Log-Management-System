apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-gateway
  labels:
    app: cloudflared-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-gateway
  template:
    metadata:
      labels:
        app: cloudflared-gateway
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --url
        - http://gateway:3000
        - --no-autoupdate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-ui
  labels:
    app: cloudflared-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-ui
  template:
    metadata:
      labels:
        app: cloudflared-ui
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --url
        - http://logintel-ui:80
        - --no-autoupdate
