ord_ts, nsec = record_ns }, out\n  end\n  return 2, timestamp, out\nend\n","parsers.conf":"[PARSER]\n    Name        docker\n    Format      json\n    Time_Key    time\n    Time_Format %Y-%m-%dT%H:%M:%S.%L\n    Time_Keep   On\n\n[PARSER]\n    Name        cri\n    Format      regex\n    Regex       ^(?\u003ctime\u003e[^ ]+) (?\u003cstream\u003estdout|stderr) (?\u003clogtag\u003e[^ ]*) (?\u003clog\u003e.*)$\n    Time_Key    time\n    Time_Format %Y-%m-%dT%H:%M:%S.%L%z\n    Time_Keep   On\n"},"kind":"ConfigMap","metadata":{"annotations":{"meta.helm.sh/release-name":"logintel-agent","meta.helm.sh/release-namespace":"logintel"},"creationTimestamp":"2026-08-19T09:55:14Z","labels":{"app.kubernetes.io/managed-by":"Helm"},"name":"logintel-agent-config","namespace":"logintel","resourceVersion":"4002870","uid":"275c437c-fc38-4065-9588-96763c8366f2"}}
