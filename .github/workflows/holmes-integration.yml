name: Build and Publish HolmesGPT Integration

on:
  push:
    branches: [main]
    paths:
      - 'holmes-agent/**'
      - 'gateway/**'
      - 'ui/**'
      - '.github/workflows/holmes-integration.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Holmes adapter
        run: |
          pip install -r holmes-agent/requirements.txt
          cd holmes-agent
          python -m unittest -v test_app.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check gateway syntax
        run: node --check gateway/server.js
      - name: Build UI
        run: npm ci --prefix ui && npm run build --prefix ui

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: logintel-holmes-agent
            context: ./holmes-agent
            target: ''
          - image: logintel-gateway
            context: ./gateway
            target: ''
          - image: logintel-ui
            context: ./ui
            target: serve
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/sayuru-priyanjana/${{ matrix.image }}:latest
            ghcr.io/sayuru-priyanjana/${{ matrix.image }}:sha-${{ github.sha }}
