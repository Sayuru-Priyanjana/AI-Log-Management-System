apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-db
  namespace: incident-test
  labels:
    app: payment-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-db
  template:
    metadata:
      labels:
        app: payment-db
    spec:
      containers:
      - name: payment-db
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "OK" > index.html
            python3 -m http.server 8080
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payment-db
  namespace: incident-test
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: payment-db
