apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    # --- INPUTS ---
    # 1. Container Logs
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On



    # 3. Kubernetes Events (Removed - now handled by dedicated event_collector deployment)

    # --- FILTERS ---
    # Add Kubernetes metadata to logs
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed

    # Transform logs into exact LogIntel schema
    [FILTER]
        Name                lua
        Match               kube.*
        script              /fluent-bit/etc/normalize.lua
        call                normalize
        time_as_table       true

    # Send application logs to central OpenSearch
    [OUTPUT]
        Name            opensearch
        Match           kube.*
        {{- $url := urlParse .Values.central.url }}
        Host            {{ $url.hostname }}
        {{- $hostParts := splitList ":" $url.host }}
        {{- $port := "" }}{{ if gt (len $hostParts) 1 }}{{ $port = last $hostParts }}{{ end }}
        Port            {{ if $port }}{{ $port }}{{ else if eq $url.scheme "https" }}443{{ else }}80{{ end }}
        HTTP_User       logintel
        HTTP_Passwd     {{ .Values.auth.token }}
        TLS             {{ if eq $url.scheme "https" }}On{{ else }}Off{{ end }}
        TLS.Verify      Off
        Logstash_Format On
        Logstash_Prefix logintel-logs
        Time_Key        @timestamp
        Time_Key_Format %Y-%m-%dT%H:%M:%S
        Time_Key_Nanos  On
        Suppress_Type_Name On
        Replace_Dots    On
        Generate_ID     On


  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name cri
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

  normalize.lua: |
    local function iso_to_epoch(value)
      if type(value) ~= "string" then return nil, nil end
      local y, mo, d, h, mi, s, frac = value:match("^(%d+)-(%d+)-(%d+)T(%d+):(%d+):(%d+)%.?(%d*)")
      if not y then return nil, nil end
      local epoch = os.time({
        year = tonumber(y), month = tonumber(mo), day = tonumber(d),
        hour = tonumber(h), min = tonumber(mi), sec = tonumber(s), isdst = false
      })
      local nanos = 0
      if frac ~= "" then nanos = tonumber((frac .. "000000000"):sub(1, 9)) or 0 end
      return epoch, nanos
    end

    -- Level resolution -----------------------------------------------------
    -- Most third-party loggers do not emit LogIntel's exact schema, so a log
    -- can arrive with no `level` field at all, a different field name, a
    -- synonym ("warning"/"err"), or as a plain-text line with no structure.
    -- Rather than ship any of that as UNKNOWN (or silently guess "INFO", the
    -- bug this replaces), infer it from whatever signal is actually present,
    -- checked from most to least reliable.
    local KNOWN_LEVELS = { ERROR=true, FATAL=true, CRITICAL=true, WARN=true,
                            INFO=true, DEBUG=true, TRACE=true }
    local LEVEL_SYNONYMS = { WARNING="WARN", ERR="ERROR", CRIT="CRITICAL",
                              EMERG="FATAL", EMERGENCY="FATAL", SEVERE="ERROR" }

    local function normalize_level_value(v)
      if v == nil then return nil end
      local up = string.upper(tostring(v))
      up = LEVEL_SYNONYMS[up] or up
      if KNOWN_LEVELS[up] then return up end
      return nil
    end

    local function pick_level_field(body)
      return body["level"] or body["severity"] or body["levelname"]
          or body["lvl"] or body["loglevel"]
    end

    local function pick_message_field(body)
      local m = body["message"] or body["msg"]
      if type(m) == "string" then return m end
      return nil
    end

    -- A real 2xx/3xx status genuinely means info-level, not a guess; only
    -- 4xx/5xx are treated as the caller needing to mark the result inferred.
    local function level_from_status_code(code)
      if code == nil then return nil end
      code = tonumber(code)
      if code == nil then return nil end
      if code >= 500 then return "ERROR" end
      if code >= 400 then return "WARN" end
      return "INFO"
    end

    -- Access-log / JSON-fragment style status codes inside free text.
    local function status_code_from_text(text)
      return text:match("HTTP/%d%.%d\"?%s+(%d%d%d)")
          or text:match("status=(%d%d%d)")
          or text:match("\"status\":%s*(%d%d%d)")
          or text:match("\"status_code\":%s*(%d%d%d)")
    end

    -- Recognises "<timestamp> <LEVEL> <rest>" (Spring Boot / Logback and
    -- similar), a logfmt/JSON-fragment "level=X" or "level":"X"" pair (Go's
    -- logrus/zerolog/zap), or a bare level keyword anywhere in the line. All
    -- matched case-insensitively: logfmt loggers in particular default to
    -- lowercase ("level=error"), unlike the Java-style uppercase convention.
    local function level_from_text(text)
      local upper = string.upper(text)
      local lvl = upper:match(
        "^%d%d%d%d%-%d%d%-%d%d.%d%d:%d%d:%d%d%.%d+%w*%s+([A-Z]+)%s+")
      if lvl == nil then
        lvl = upper:match("[\"']?LEVEL[\"']?%s*[=:]%s*[\"']?([A-Z]+)")
      end
      if lvl == nil then
        lvl = upper:match("%s+(ERROR)%s+") or upper:match("%s+(WARNING)%s+")
           or upper:match("%s+(WARN)%s+") or upper:match("%s+(INFO)%s+")
           or upper:match("%s+(DEBUG)%s+") or upper:match("%s+(FATAL)%s+")
      end
      return normalize_level_value(lvl)
    end

    -- Returns level, inferred(bool). `inferred` marks a guess so it can be
    -- told apart from a level the application (or a recognised log format)
    -- actually reported.
    local function resolve_level(body, message)
      local lvl = normalize_level_value(pick_level_field(body))
      if lvl then return lvl, false end

      -- 1. A recognisable text log format states its own level explicitly.
      if type(message) == "string" and message ~= "" then
        local text_lvl = level_from_text(message)
        if text_lvl then return text_lvl, false end
      end

      -- 2. HTTP status code - structured field first, then free text.
      local http = body["http"]
      local code = (http and http["status_code"])
                or body["status"] or body["status_code"] or body["http_status"]
      if code == nil and type(message) == "string" then
        code = status_code_from_text(message)
      end
      local from_status = level_from_status_code(code)
      if from_status then return from_status, true end

      -- 3. An explicit error object, or a failed dependency/event outcome.
      local err = body["error"]
      if err and (err["type"] ~= nil or err["message"] ~= nil or err["stack_trace"] ~= nil) then
        return "ERROR", true
      end
      local event = body["event"]
      if event and event["outcome"] == "failure" then return "ERROR", true end
      local dep = body["dependency"]
      if dep and dep["outcome"] == "failure" then return "ERROR", true end

      -- 4. Last resort: keyword scan of the message text.
      if type(message) == "string" and message ~= "" then
        local upper = string.upper(message)
        if string.find(upper, "TRACEBACK", 1, true) or string.find(upper, "EXCEPTION", 1, true)
           or string.find(upper, "FATAL", 1, true) or string.find(upper, "PANIC", 1, true)
           or string.find(upper, "ERROR", 1, true) then
          return "ERROR", true
        elseif string.find(upper, "WARN", 1, true) then
          return "WARN", true
        elseif string.find(upper, "DEBUG", 1, true) then
          return "DEBUG", true
        end
      end

      -- Genuinely nothing to go on. Honest, not a guessed "INFO".
      return "UNKNOWN", false
    end

    function normalize(tag, timestamp, record)
      local kube = record["kubernetes"]
      if kube == nil then return -1, 0, 0 end

      local labels = kube["labels"] or {}
      local out = {}

      out["system"] = {
        id   = "{{ .Values.auth.clusterId }}",
        name = "{{ .Values.central.systemName }}"
      }
      out["environment"] = "testbed"
      out["source"] = { type = "kubernetes", collector = "fluent-bit" }
      out["kubernetes"] = {
        cluster   = "{{ .Values.auth.clusterId }}",
        namespace = kube["namespace_name"],
        pod       = { name = kube["pod_name"], uid = kube["pod_id"] },
        container = { name = kube["container_name"], image = kube["container_image"] },
        node      = { name = kube["host"] }
      }

      local body = record["log"]
      local parsed = record["log_processed"]
      local record_ts, record_ns = nil, nil

      if type(parsed) == "table" then
        if parsed["log"] ~= nil then
          body = parsed["log"]
        else
          body = parsed
        end
        for k, v in pairs(parsed) do
          if k ~= "log" and k ~= "kubernetes" and k ~= "@timestamp" then
            out[k] = v
          end
        end
        record_ts, record_ns = iso_to_epoch(parsed["@timestamp"])
      end

      if type(body) == "table" then
        out["log"] = body
        local message = pick_message_field(body) or ""
        out["log"]["message"] = message
        local level, inferred = resolve_level(body, message)
        out["log"]["level"] = level
        if inferred then out["log"]["level_inferred"] = true end
      else
        local str_body = tostring(body or "")
        -- Strip a leading "<timestamp> <LEVEL>" prefix (Spring Boot / Logback
        -- and similar) so the stored message doesn't repeat it, and hand the
        -- extracted level to resolve_level as an explicit value rather than
        -- re-detecting it from text.
        local synthetic = {}
        local ts, parsed_lvl, rest = str_body:match(
          "^(%d%d%d%d%-%d%d%-%d%d.%d%d:%d%d:%d%d%.%d+%w*)%s+([A-Za-z]+)%s+(.*)")
        if ts ~= nil and normalize_level_value(parsed_lvl) ~= nil then
          synthetic["level"] = parsed_lvl
          str_body = rest
        end
        local level, inferred = resolve_level(synthetic, str_body)
        out["log"] = { level = level, message = str_body }
        if inferred then out["log"]["level_inferred"] = true end
      end

        if out["service"] == nil then
          local svc_name = labels["app.kubernetes.io/name"] or labels["app"] or labels["name"] or labels["k8s-app"]
          if svc_name == nil and kube["container_name"] ~= nil then
            svc_name = kube["container_name"]
          end
          if svc_name ~= nil then
            out["service"] = { name = svc_name }
          end
        end

      out["@timestamp"] = nil

      if record_ts ~= nil then
        return 2, { sec = record_ts, nsec = record_ns }, out
      end
      return 2, timestamp, out
    end
