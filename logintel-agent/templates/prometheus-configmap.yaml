apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        system_id: {{ .Values.auth.clusterId }}

    remote_write:
      - url: "{{ .Values.central.prometheus_url }}"
        authorization:
          credentials: "{{ .Values.auth.token }}"
        # Disable TLS verification for local self-signed setups if necessary
        tls_config:
          insecure_skip_verify: true

    scrape_configs:
      # --- cAdvisor: container CPU / memory / throttling -------------------
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|cpu_cfs_throttled_seconds_total|cpu_cfs_periods_total|spec_memory_limit_bytes|spec_cpu_quota|spec_cpu_period|last_seen)'
            action: keep
          - source_labels: [container]
            regex: '^$'
            action: drop


      # --- kubelet: pod-level state ---------------------------------------
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # --- node-exporter --------------------------------------------------
      - job_name: 'node-exporter'
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: $1:9100

      # --- kube-state-metrics ---------------------------------------------
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ['kube-state-metrics.{{ .Values.namespace }}.svc:8080']

      # --- application pods -----------------------------------------------
      - job_name: application-pods
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
