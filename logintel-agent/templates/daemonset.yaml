apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      initContainers:
        - name: inject-token
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cp -rL /fluent-bit/etc/* /fluent-bit/etc-merged/ && sed -i "s/\${BEARER_TOKEN}/$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)/g" /fluent-bit/etc-merged/fluent-bit.conf
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: config-merged
              mountPath: /fluent-bit/etc-merged
      containers:
        - name: fluent-bit
          image: {{ .Values.fluentbit.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
{{ toYaml .Values.fluentbit.resources | indent 12 }}
          volumeMounts:
            - name: config-merged
              mountPath: /fluent-bit/etc/
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Chart.Name }}-config
        - name: config-merged
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
